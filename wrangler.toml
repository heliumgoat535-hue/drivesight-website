name = "drivesight-website"
compatibility_date = "2024-01-01"

[assets]
directory = "."
binding = "ASSETS"
# /api/* must reach the worker BEFORE asset handling — the platform's asset
# layer 405s non-GET requests on its own otherwise (the TURN proxy is a POST).
run_worker_first = ["/api/*"]

[build]
command = ""

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
