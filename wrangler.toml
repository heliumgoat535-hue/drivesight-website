name = "drivesight-website"
# main is REQUIRED for the worker script to deploy at all — without it wrangler
# treats this as an assets-only project, silently never deploying
# redirect-worker.js (bot block, /api/turn proxy, short links were all dead).
main = "redirect-worker.js"
compatibility_date = "2025-06-01"

[assets]
directory = "."
binding = "ASSETS"
# Run the worker on every request (boolean form — the ["/api/*"] array form
# needs newer wrangler). Without this the platform asset layer answers first:
# non-GET requests get 405ed before the /api/turn TURN proxy can run, and the
# bot-UA block never applied to real pages either. Normal paths still serve
# assets via env.ASSETS.fetch at the end of the worker.
run_worker_first = true

# Opinly blog (src/opinly/). Non-secret config lives here; secrets are set in
# the dashboard (Workers & Pages → drivesight-website → Settings → Variables
# and Secrets) or `wrangler secret put`:
#   OPINLY_API_KEY                 sk-… content API key (required)
#   OPINLY_WEBHOOK_SIGNING_SECRET  whsec_… from Opinly Settings → Developers (required for /api/opinly-webhook)
#   CF_ZONE_ID + CF_PURGE_TOKEN    optional: zone-wide cache purge on webhook (token needs Zone → Cache Purge)
#   OPINLY_PURCHASE_INGEST_TOKEN   optional: enables POST /api/opinly/purchase for server-side revenue
# Local dev reads the same names from .dev.vars (gitignored).
[vars]
OPINLY_API_URL = "https://sdk.opinly.ai"

[build]
command = ""

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
