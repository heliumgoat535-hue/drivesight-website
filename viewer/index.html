        body {

        }

        .pair-logo {
            width: 80px;

        .pair-title {

            font-weight: 700;
            margin-bottom: 8px;

        .pair-subtitle {

        }

        .code-input-row {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-bottom: 24px;

        .pin-input {

            background: #1a1a1a;
            border: 2px solid #333;
            border-radius: 10px;
            color: #fff;
            font-size: 28px;

            text-align: center;
            letter-spacing: 8px;

        .pin-input:focus {

            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .connect-btn:hover { background: #236B38; }
        .connect-btn:disabled { background: #333; color: #666; cursor: not-allowed; }

        .pair-hint {
            margin-top: 16px;
            font-size: 12px;
            color: #555;
            line-height: 1.5;
        }

        .pair-error {
            margin-top: 12px;
            font-size: 13px;
            color: #ef4444;
            min-height: 20px;
        }

        /* ─── Viewer Screen ──────────────────────────────────────── */
        .viewer-screen { display: none; width: 100%; height: 100%; }
        .viewer-screen.active { display: flex; flex-direction: column; }
        .pair-screen.hidden { display: none; }

        /* Status bar at top */
        .status-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;

        }

        .status-left {
            display: flex;
            align-items: center;
            gap: 8px;

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;

            transition: background 0.3s;
        }
        .status-dot.connecting { background: #f59e0b; animation: pulse 1.5s infinite; }
        .status-dot.connected { background: #22c55e; }
        .status-dot.failed { background: #ef4444; }

        .status-text {
            font-size: 14px;
            color: #999;
            transition: color 0.3s;

        .status-text.connected { color: #22c55e; }
        .status-text.failed { color: #ef4444; }

        .logo-text {
            font-size: 13px;
            color: #555;
            font-weight: 600;

            font-size: 13px;
            color: #999;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }
        .temp-readout.hot { color: #ef4444; }

        /* Push-notification status. Every failure path in the FCM handshake
           used to return silently, so "no push arrived" was undiagnosable
           without a desktop debugger attached. This surfaces the actual
           reason on the device itself; tapping retries the handshake. */
        .push-status {
            font-size: 12px;
            font-weight: 600;
            color: #999;
            cursor: pointer;
            white-space: nowrap;

            width: 100%;
            height: 100%;

        .center-overlay {

            border-radius: 50%;

            margin: 0 auto 16px;

        .overlay-title {

            margin-bottom: 8px;

            border-radius: 8px;

            font-weight: 600;

        /* Motion alert banner */
        .motion-alert {
            position: fixed;
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
            background: #ef4444;
            color: #fff;
            padding: 10px 20px;
            border-radius: 8px;

        .motion-alert-icon { width: 20px; height: 20px; }

        /* Threat alert card (Smart Parking Guard) — bigger, sticky, shows the

        .threat-alert {
            position: fixed;
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
            width: min(340px, calc(100vw - 32px));
            background: #7f1d1d;
            border: 1px solid #ef4444;
            color: #fff;
            border-radius: 12px;
            overflow: hidden;
            z-index: 20;
            cursor: pointer;
            animation: slideDown 0.3s ease-out;
            box-shadow: 0 8px 32px rgba(239,68,68,0.5);
        }

        .threat-alert-header {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 16px 4px;
            font-size: 15px;
            font-weight: 700;
        }

        .threat-alert-sub {
            padding: 0 16px 12px;
            font-size: 13px;
            color: #fecaca;
        }

        .threat-alert-photo {
            display: block;
            width: 100%;
            max-height: 220px;
            object-fit: cover;
            background: #450a0a;
        }

        .threat-alert-footer {
            display: flex;
            border-top: 1px solid rgba(239,68,68,0.4);
        }

        .threat-alert-btn {
            flex: 1;
            padding: 12px 8px;
            background: none;
            border: none;
            color: #fff;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }

        .threat-alert-btn + .threat-alert-btn {
            border-left: 1px solid rgba(239,68,68,0.4);
        }

        .threat-alert-btn.dismiss { color: #fca5a5; }

        /* Bottom bar */
        .bottom-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px 16px;
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
            z-index: 10;
            gap: 12px;
        }

        .fullscreen-btn, .talk-btn {
            padding: 8px 16px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            color: #ccc;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            -webkit-user-select: none;
            user-select: none;
            touch-action: none;
        }
        .fullscreen-btn:hover, .talk-btn:hover { background: rgba(255,255,255,0.2); }
        .talk-btn.active { background: #ef4444; border-color: #ef4444; color: #fff; }

        .hidden { display: none !important; }

        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
        @keyframes slideDown { from { top: 40px; opacity: 0; } to { top: 60px; opacity: 1; } }
        @keyframes fadeOut { to { opacity: 0; visibility: hidden; } }

        @media (orientation: landscape) {
            .status-bar { padding: 8px 16px; }
            .bottom-bar { padding: 8px 16px; }
        }

        .error-icon { font-size: 48px; margin-bottom: 12px; }

        /* Unpair / new code button */
        .unpair-link {
            position: fixed;
            bottom: 56px;
            right: 12px;
            font-size: 13px;
            color: #888;
            cursor: pointer;
            z-index: 11;
            padding: 6px 12px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 6px;
        }
        .unpair-link:hover { color: #fff; background: rgba(255,255,255,0.15); }
    </style>

<body>

    <h1 style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;">DriveSight Remote Viewer — Live Dashcam Streaming</h1>

    <!-- ═══ PAIRING SCREEN ═══ -->
    <div class="pair-screen" id="pairScreen">
        <img decoding="async" width="1024" height="1024" class="pair-logo" src="../assets/icon-512.webp" alt="DriveSight" onerror="this.style.display='none'">

                <div class="overlay-title" id="overlayTitle">Connecting to Dashcam...</div>

                <button class="retry-btn hidden" id="retryBtn" onclick="retryConnection()">Retry Connection</button>

        <!-- Bottom bar -->
        <div class="bottom-bar">
            <button class="talk-btn" id="talkBtn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/>
                    <path d="M19 10v2a7 7 0 01-14 0v-2"/>

    <!-- Motion alert (injected dynamically) -->

    <!-- Firebase JS SDK (self-hosted to bypass CSP that blocks gstatic.com) -->
    <script src="firebase-app-compat.js"></script>
    <script src="firebase-firestore-compat.js"></script>
    <script src="firebase-messaging-compat.js"></script>

    <script>
        // ─── Firebase Config ───────────────────────────────────────────
        const firebaseConfig = {
            apiKey: "AIzaSyAx1dWh8cc_1wohB-3Be94GgbyELiOxuY0",
            authDomain: "deer-dash.firebaseapp.com",
            projectId: "deer-dash",
            storageBucket: "deer-dash.firebasestorage.app",
            messagingSenderId: "834190963152",
            appId: "1:834190963152:web:9d0cfa99a65c81f25889d5"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // ─── Parse URL params ──────────────────────────────────────────
        const params = new URLSearchParams(window.location.search);
        // Direct session access via QR code (new flow)
        let directSessionId = params.get('s');
        let directSecret = params.get('k');
        // Legacy device ID (old PIN flow)
        // Accept 'd' (legacy) or 'code' (QR code from Android app) as the device/pairing code
        let deviceId = params.get('d') || params.get('code') || localStorage.getItem('drivesight_device_id');
        let sessionId = null;
        let sessionSecret = null;

        // ─── DOM refs ──────────────────────────────────────────────────
        const pairScreen = document.getElementById('pairScreen');
        const viewerScreen = document.getElementById('viewerScreen');
        const connectBtn = document.getElementById('connectBtn');
        const pairError = document.getElementById('pairError');
        const video = document.getElementById('remoteVideo');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const centerOverlay = document.getElementById('centerOverlay');
        const spinner = document.getElementById('spinner');
        const overlayTitle = document.getElementById('overlayTitle');
        const overlaySubtitle = document.getElementById('overlaySubtitle');
        const retryBtn = document.getElementById('retryBtn');
        const alertContainer = document.getElementById('alertContainer');

        // ─── State ─────────────────────────────────────────────────────
        let peerConnection = null;
        let unsubAnswer = null;
        let unsubCandidates = null;
        let unsubMotion = null;
        let unsubDevice = null;
        let lastMotionTimestamp = 0;
        let lastTempAlertTimestamp = 0;
        let localMicStream = null;
        let micSender = null;
        let micTrackForPtt = null;   // local audio track, used to attach/detach via replaceTrack
        let pttReady = false;
        let pttSending = false;
        let pttStatsTimer = null;
        let currentOffer = null; // track current SDP offer to detect dashcam reconnects
        let unsubOfferWatch = null;
        let connectingInProgress = false; // prevent re-entrant connection attempts
        let connectingSince = 0;          // when the in-flight attempt started
        let reconnectTimer = null;        // pending auto-reconnect
        // An "in progress" attempt older than this is a corpse (tab was frozen
        // mid-handshake) — reset it instead of letting it block reconnects.
        const CONNECT_ATTEMPT_STALE_MS = 20000;

        function scheduleReconnect(delayMs) {
            if (reconnectTimer) return;
            reconnectTimer = setTimeout(() => {
                reconnectTimer = null;
                if (peerConnection && peerConnection.connectionState === 'connected') return;
                console.log('Auto-reconnect: cleaning up dead connection and retrying');
                cleanup();
                tryConnectSession();
            }, delayMs);
        }

        // ─── Single-viewer lock ─────────────────────────────────────────
        // Persisted: the id must survive tab eviction (screen off) or the same
        // phone reopening the viewer trips its OWN stale lock ("Already in Use")
        // for up to 90s. Same id = instant take-over of our own lock.
        const viewerId = (() => {
            let id = localStorage.getItem('drivesight_viewer_id');
            if (!id) {
                id = Math.random().toString(36).substr(2, 12) + Date.now();
                localStorage.setItem('drivesight_viewer_id', id);
            }
            return id;
        })();
        let heartbeatInterval = null;

        // ─── ICE config ────────────────────────────────────────────────
        const rtcConfig = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' },
                { urls: 'stun:stun2.l.google.com:19302' },
                { urls: 'stun:stun3.l.google.com:19302' }
            ],
            sdpSemantics: 'unified-plan'
        };

        // ─── PIN Input Handling ───────────────────────────────────────
        const pinInput = document.getElementById('pinInput');

        pinInput.addEventListener('input', (e) => {
            e.target.value = e.target.value.replace(/[^A-Za-z0-9]/g, '').toUpperCase();
            updateConnectBtn();
        });
        pinInput.addEventListener('change', updateConnectBtn);
        pinInput.addEventListener('blur', updateConnectBtn);
        pinInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') pairAndConnect();
        });

        function updateConnectBtn() {
            connectBtn.disabled = pinInput.value.length < 4;
        }

        updateConnectBtn();

        // Some mobile browsers + autofill paths populate the input without firing
        // any input/change/blur event, leaving the Connect button stuck disabled.
        // Poll the value as a brute-force fallback.
        setInterval(updateConnectBtn, 250);

        function getCode() {
            return pinInput.value;
        }

        // ─── Pairing ──────────────────────────────────────────────────
        async function pairAndConnect() {
            const code = getCode().toUpperCase();
            if (code.length < 4) return;

            connectBtn.disabled = true;
            connectBtn.textContent = 'Connecting...';
            pairError.textContent = '';

            try {
                const deviceDoc = await db.collection('devices').doc(code).get();
                if (!deviceDoc.exists) {
                    pairError.textContent = 'PIN not found. Check your PIN and make sure Remote Viewer is enabled in the app.';
                    connectBtn.disabled = false;
                    connectBtn.textContent = 'Connect';
                    return;
                }

                // Save device
                deviceId = code;
                localStorage.setItem('drivesight_device_id', code);
                const data = deviceDoc.data();
                sessionId = data.sessionId;
                sessionSecret = data.sessionSecret;

                // ── Show confirmation on pairing screen before switching ──
                connectBtn.textContent = '✓ Code Accepted!';
                connectBtn.style.background = '#22c55e';
                pairError.style.color = '#888';
                pairError.textContent = 'Switching to viewer...';

                await new Promise(r => setTimeout(r, 1500));

                showViewer();
                await connectToSession();
            } catch (err) {
                pairError.textContent = 'Connection failed. Check your internet.';
                connectBtn.disabled = false;
                connectBtn.textContent = 'Connect';
            }
        }

        function showViewer() {
            pairScreen.classList.add('hidden');
            viewerScreen.classList.add('active');
        }

        function unpair() {
            localStorage.removeItem('drivesight_device_id');
            localStorage.removeItem('drivesight_session_id');
            localStorage.removeItem('drivesight_session_secret');
            if (unsubDevice) { unsubDevice(); unsubDevice = null; }
            cleanup();
            // Navigate to clean viewer URL (no params)
            window.location.href = window.location.pathname;
        }

        // ─── Direct session connection (QR code flow) ─────────────────
        async function connectDirect(sid, secret) {
            sessionId = sid;
            sessionSecret = secret;
            // Save to localStorage so user can reopen/bookmark
            localStorage.setItem('drivesight_session_id', sid);
            localStorage.setItem('drivesight_session_secret', secret);
            showViewer();
            setStatus('connecting', 'Connecting...');
            showOverlay('Connecting to Dashcam...', 'Establishing secure connection', true, false);

            // Watch the session doc — if it gets deleted, parking mode ended
            const unsubSession = db.collection('webrtc_sessions').doc(sid)
                .onSnapshot((snap) => {
                    if (!snap.exists) {
                        cleanup();
                        setStatus('failed', 'Session ended');
                        showOverlay('Parking Mode Ended', 'The dashcam is no longer streaming.', false, false);
                        // Clear saved session
                        localStorage.removeItem('drivesight_session_id');
                        localStorage.removeItem('drivesight_session_secret');
                        unsubSession();
                    }
                });

            await tryConnectSession();
        }

        // ─── UI helpers ────────────────────────────────────────────────

        function showMotionAlert() {
            const alert = document.createElement('div');
            alert.className = 'motion-alert';
            alert.innerHTML = `
                <svg class="motion-alert-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>

            `;
            // A threat card outranks a motion toast — never let the toast's
            // container-clear wipe it before the user hits Save/Dismiss. (This
            // was exactly how threat cards kept vanishing: the person triggers
            // more motion seconds after the verdict.)
            if (!alertContainer.querySelector('.threat-alert')) {
                alertContainer.innerHTML = '';
                alertContainer.appendChild(alert);
                setTimeout(() => { alert.remove(); }, 5000);

            if (Notification.permission === 'granted') {

                    renotify: true,
                    requireInteraction: true

        // Smart Parking Guard threat card — richer than the motion toast:
        // names the behavior (lingering/approaching), shows the uploaded photo
        // when the phone's upload beat the alert, and sticks around until
        // tapped (or 30 s). The FCM push is the out-of-page channel; this is
        // the in-page mirror of the same alert.
        function showThreatAlert(kind, imageUrl) {
            const behavior = kind === 'approaching' ? 'approaching' : 'lingering at';
            const card = document.createElement('div');
            card.className = 'threat-alert';
            card.innerHTML = `
                <div class="threat-alert-header">
                    <svg class="motion-alert-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
                        <line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
                    </svg>
                    Person at your car
                </div>
                <div class="threat-alert-sub">Someone is ${behavior} your vehicle. Recording started.</div>
            `;
            if (imageUrl) {
                const photo = document.createElement('img');
                photo.className = 'threat-alert-photo';
                photo.alt = 'Person detected by dashcam';
                photo.src = imageUrl;
                photo.onerror = () => photo.remove();
                card.appendChild(photo);
            }
            const footer = document.createElement('div');
            footer.className = 'threat-alert-footer';
            if (imageUrl) {
                const saveBtn = document.createElement('button');
                saveBtn.className = 'threat-alert-btn';
                saveBtn.textContent = 'Save photo';
                saveBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    saveThreatPhoto(imageUrl, saveBtn);
                });
                footer.appendChild(saveBtn);
            }
            const dismissBtn = document.createElement('button');
            dismissBtn.className = 'threat-alert-btn dismiss';
            dismissBtn.textContent = 'Dismiss';
            dismissBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                card.remove();
            });
            footer.appendChild(dismissBtn);
            card.appendChild(footer);
            card.addEventListener('click', () => card.remove());
            alertContainer.innerHTML = '';
            alertContainer.appendChild(card);

            if (Notification.permission === 'granted') {
                new Notification('⚠️ Person at your car', {
                    body: `Someone is ${behavior} your vehicle. Recording started.`,
                    icon: '../assets/icon-512.png',
                    image: imageUrl || undefined,
                    tag: 'threat-alert',
                    renotify: true,
                    requireInteraction: true
                });
            }

            // No auto-hide: a threat is the one alert worth interrupting for,
            // and the photo deserves a proper look. Stays until tapped.
        }

        // Download the threat photo to the device. The storage URL is only as
        // permanent as the clip cleanup that owns it, so "save" means a local
        // copy, not a bookmark. Falls back to opening the image in a new tab
        // if the fetch fails (e.g. offline mid-save).
        async function saveThreatPhoto(imageUrl, btn) {
            const prev = btn.textContent;
            btn.textContent = 'Saving…';
            try {
                const resp = await fetch(imageUrl);
                if (!resp.ok) throw new Error('HTTP ' + resp.status);
                const blob = await resp.blob();
                const url = URL.createObjectURL(blob);
                const ts = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'DriveSight_threat_' + ts + '.jpg';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                setTimeout(() => URL.revokeObjectURL(url), 1000);
                btn.textContent = 'Saved!';
                setTimeout(() => { btn.textContent = prev; }, 1500);
            } catch (e) {
                console.warn('Threat photo save failed:', e.message);
                btn.textContent = prev;
                window.open(imageUrl, '_blank');
            }
        }

        // ─── Cabin temperature (Parking Mode) ───────────────────────────
        function formatTemp(celsius, approximate) {
            const c = Math.round(celsius);
            const f = Math.round(celsius * 9 / 5 + 32);
            return `${f}°F / ${c}°C${approximate ? ' (est)' : ''}`;
        }

        function updateTempReadout(celsius, approximate) {
            const el = document.getElementById('tempReadout');
            el.textContent = `🌡 ${formatTemp(celsius, approximate)}`;
            el.classList.toggle('hot', celsius >= 40);

        function showTempAlert(celsius) {

                </svg>

            // Same priority rule as the motion toast: never wipe a threat card.

        // ─── Snapshot — grab the current live frame and download it ─────────
        function takeSnapshot() {
            if (!video || !video.videoWidth || !video.videoHeight) {
                alert('No live video to capture yet.');
                return;
            }
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            canvas.toBlob(function (blob) {
                if (!blob) return;
                const url = URL.createObjectURL(blob);
                const ts = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'DriveSight_' + ts + '.jpg';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                setTimeout(() => URL.revokeObjectURL(url), 1000);
            }, 'image/jpeg', 0.95);
            // Brief visual confirmation on the button label.
            const label = document.getElementById('snapshotLabel');
            if (label) {
                const prev = label.textContent;
                label.textContent = 'Saved!';
                setTimeout(() => { label.textContent = prev; }, 1200);
            }
        }

        // ─── FCM Web Push ──────────────────────────────────────────────
        let fcmToken = null;

        function setPushStatus(state, label, detail) {
            const el = document.getElementById('pushStatus');
            if (!el) return;
            el.className = 'push-status ' + state;
            el.textContent = label;
            el.title = detail || label;
        }

        // Write the token to wherever the Cloud Function will look for it.
        // The dashcam mints a NEW session document every time Parking Mode
        // arms, so this must run again on every session switch — a token
        // saved only on the first session is invisible to later alerts.
        async function saveFcmToken() {
            if (!fcmToken) return;
            let saved = false;
            if (sessionId) {
                try {
                    await db.collection('webrtc_sessions').doc(sessionId)
                        .update({ viewerFcmToken: fcmToken });
                    saved = true;
                } catch (e) {
                    console.warn('Could not save FCM token to session doc:', e.message);
                }
            }
            if (deviceId) {
                try {
                    await db.collection('devices').doc(deviceId)
                        .set({ viewerFcmToken: fcmToken }, { merge: true });
                    saved = true;
                } catch (e) {
                    console.warn('Could not save FCM token to device doc:', e.message);
                }
            }
            if (saved) {
                console.log('FCM token saved for push notifications');
                setPushStatus('on', '🔔 Push on', 'Alerts will reach this device even with the viewer closed.');
            } else {
                setPushStatus('off', '🔕 Push not saved', 'Got a push token but could not store it. Tap to retry.');
            }
        }

        async function setupPushNotifications() {
            try {
                if (!('Notification' in window) || !('serviceWorker' in navigator)) {
                    setPushStatus('off', '🔕 Push unsupported',
                        'This browser cannot receive push. On iPhone, add this page to your Home Screen and open it from there.');
                    return;
                }

                // Register service worker for background push
                const swReg = await navigator.serviceWorker.register('firebase-messaging-sw.js')
                    .catch(e => { console.log('SW registration failed:', e.message); return e; });
                if (!swReg || !swReg.scope) {
                    setPushStatus('off', '🔕 Push blocked', 'Background service worker failed to register: ' + (swReg && swReg.message));
                    return;
                }

                const permission = await Notification.requestPermission();
                if (permission !== 'granted') {
                    setPushStatus('off', '🔕 Push ' + permission,
                        permission === 'denied'
                            ? 'Notifications are blocked for this site. Allow them in site settings, then reload.'
                            : 'Tap here and choose Allow to receive alerts when the viewer is closed.');
                    return;
                }

                const messaging = firebase.messaging();
                let token = null;
                try {
                    token = await messaging.getToken({ serviceWorkerRegistration: swReg });
                } catch (e) {
                    console.warn('getToken failed:', e.code || '', e.message);
                    setPushStatus('off', '🔕 Push failed', 'Could not get a push token: ' + e.message);
                    return;
                }
                if (!token) {
                    setPushStatus('off', '🔕 Push failed', 'Push service returned no token. Tap to retry.');
                    return;
                }

                fcmToken = token;
                await saveFcmToken();

                // Handle foreground messages
                messaging.onMessage((payload) => {
                    console.log('FCM message received:', payload);
                    if (payload.data && payload.data.type === 'motion_alert') {
                        showMotionAlert();
                    }
                    if (payload.data && payload.data.type === 'threat_alert') {
                        showThreatAlert(payload.data.kind, payload.data.imageUrl);
                    }
                    if (payload.data && payload.data.type === 'temp_alert') {
                        showTempAlert(parseFloat(payload.data.celsius) || 0);
                    }
                });
            } catch (err) {
                console.log('Push notification setup skipped:', err.message);
                setPushStatus('off', '🔕 Push error', err.message);
            }
        }

        // ─── Request notification permission ───────────────────────────
        function requestNotificationPermission() {
            if ('Notification' in window && Notification.permission === 'default') {
                Notification.requestPermission();
            }
        }

        // ─── Connection logic ──────────────────────────────────────────
        async function connectToSession() {
            setStatus('connecting', 'Waiting for dashcam...');
            showOverlay('Waiting for Dashcam...', 'Open DriveSight and switch to the Drive screen with Remote Viewer enabled', true, false);

            // Stop any previous device listener
            if (unsubDevice) { unsubDevice(); unsubDevice = null; }

            // ── Live-listen on the device doc so we auto-connect when dashcam comes online ──
            unsubDevice = db.collection('devices').doc(deviceId)
                .onSnapshot(async (deviceSnap) => {
                    // Ignore if we're already connected or a FRESH attempt is
                    // in flight. A stale attempt (tab frozen mid-handshake) or a
                    // peer stuck in 'connecting'/'new' must NOT block reconnect.
                    if (peerConnection && peerConnection.connectionState === 'connected') return;
                    if (connectingInProgress) {
                        if (Date.now() - connectingSince < CONNECT_ATTEMPT_STALE_MS) return;
                        console.log('Stale connection attempt — resetting');
                        cleanup();
                    }

                    if (!deviceSnap.exists) {
                        setStatus('connecting', 'Waiting for dashcam...');
                        showOverlay('Waiting for Dashcam...', 'Open DriveSight and switch to the Drive screen with Remote Viewer enabled', true, false);
                        return;
                    }

                    const deviceData = deviceSnap.data();
                    const newSessionId = deviceData.sessionId;
                    const newSecret = deviceData.sessionSecret;

                    if (!newSessionId || !newSecret) {
                        setStatus('connecting', 'Waiting for dashcam...');
                        showOverlay('Waiting for Dashcam...', 'Enable Remote Viewer in DriveSight Settings, then switch to Drive screen', true, false);
                        return;
                    }

                    // If session changed (dashcam restarted), clean up old connection
                    if (newSessionId !== sessionId && peerConnection) {
                        console.log('Session changed — reconnecting');
                        cleanup();
                    }

                    sessionId = newSessionId;
                    sessionSecret = newSecret;

                    // Re-point push at the new session document (see saveFcmToken).
                    saveFcmToken();

                    // Now try to connect to the WebRTC session
                    await tryConnectSession();

                }, (err) => {
                    console.error('Device listener error:', err);
                    showOverlay('Connection Error', 'Failed to reach server. Check your internet.', false, true);
                    setStatus('failed', 'Connection error');
                });
        }

        async function tryConnectSession() {
            // Already in a WebRTC session or mid-setup — skip. Stale attempts
            // (frozen tab) are reset rather than honored.
            if (peerConnection && peerConnection.connectionState === 'connected') return;
            if (connectingInProgress) {
                if (Date.now() - connectingSince < CONNECT_ATTEMPT_STALE_MS) return;
                cleanup();
            }

            connectingInProgress = true;
            connectingSince = Date.now();
            setStatus('connecting', 'Connecting...');
            showOverlay('Connecting to Dashcam...', 'Establishing secure peer-to-peer connection', true, false);

            try {
                const sessionDoc = await db.collection('webrtc_sessions').doc(sessionId).get();

                if (!sessionDoc.exists) {
                    // Session doc not created yet — wait for device listener to fire again
                    setStatus('connecting', 'Waiting for session...');
                    showOverlay('Waiting for Dashcam...', 'Dashcam is starting up...', true, false);
                    connectingInProgress = false;
                    return;
                }

                const sessionData = sessionDoc.data();

                if (sessionData.sessionSecret !== sessionSecret) {
                    showOverlay('Access Denied', 'Session secret mismatch.', false, true);
                    setStatus('failed', 'Access denied');
                    connectingInProgress = false;
                    return;
                }

                const sdpOffer = sessionData.dashcamOffer;
                if (!sdpOffer) {
                    // Offer not ready yet — listen for it
                    showOverlay('Waiting for Dashcam...', 'Waiting for dashcam to start streaming...', true, false);
                    setStatus('connecting', 'Waiting for stream...');

                    unsubAnswer = db.collection('webrtc_sessions').doc(sessionId)
                        .onSnapshot((snap) => {
                            const data = snap.data();
                            if (data && data.dashcamOffer) {
                                if (unsubAnswer) unsubAnswer();
                                unsubAnswer = null;
                                startWebRtc(data.dashcamOffer);
                            }
                        });
                    // Keep connectingInProgress true — startWebRtc will clear it
                    return;
                }

                await startWebRtc(sdpOffer);

            } catch (err) {
                console.error('Connection error:', err);
                showOverlay('Connection Error', 'Failed to connect. Check your internet and try again.', false, true);
                setStatus('failed', 'Connection error');
                connectingInProgress = false;
            }
        }

        async function startWebRtc(sdpOffer) {
            connectingInProgress = true;
            connectingSince = Date.now();
            setStatus('connecting', 'Connecting...');
            showOverlay('Connecting to Dashcam...', 'Setting up peer-to-peer video stream', true, false);

            // ── Check if another viewer is already connected ──
            try {
                const lockCheck = await db.collection('webrtc_sessions').doc(sessionId).get();
                const lockData = lockCheck.data();
                if (lockData && lockData.viewerConnected && lockData.viewerConnected !== viewerId) {
                    const heartbeat = lockData.viewerHeartbeat || lockData.viewerConnectedAt || 0;
                    const age = Date.now() - heartbeat;
                    if (age < 90000) { // Heartbeat within 90 seconds = viewer is alive
                        showOverlay('Already in Use', 'Another device is already viewing this dashcam. Only one viewer can connect at a time.', false, true);
                        setStatus('failed', 'Already in use');
                        connectingInProgress = false;
                        return;
                    }
                    console.log('Previous viewer lock is stale (' + Math.round(age / 1000) + 's) — taking over');
                }
            } catch (lockErr) {
                console.warn('Viewer lock check failed:', lockErr.message);
            }

            requestNotificationPermission();
            setupPushNotifications();

            // ── Clear stale viewer data from previous connection ──
            try {
                // Remove old viewer answer so dashcam knows to expect a fresh one
                await db.collection('webrtc_sessions').doc(sessionId)
                    .update({ viewerAnswer: firebase.firestore.FieldValue.delete(), status: 'waiting' });

                // Delete old viewer ICE candidates
                const oldCandidates = await db.collection('webrtc_sessions').doc(sessionId)
                    .collection('viewerCandidates').get();
                const batch = db.batch();
                oldCandidates.forEach(doc => batch.delete(doc.ref));
                if (!oldCandidates.empty) await batch.commit();
                console.log('Cleared stale viewer data (' + oldCandidates.size + ' old candidates)');
            } catch (cleanErr) {
                console.warn('Failed to clear stale data (may be first connection):', cleanErr.message);
            }

            peerConnection = new RTCPeerConnection(rtcConfig);

            peerConnection.ontrack = (event) => {
                console.log('Got remote track:', event.track.kind);
                if (event.streams && event.streams[0]) {
                    video.srcObject = event.streams[0];
                } else {
                    const stream = new MediaStream();
                    stream.addTrack(event.track);
                    video.srcObject = stream;
                }
            };

            peerConnection.onicecandidate = async (event) => {
                if (event.candidate) {
                    try {
                        await db.collection('webrtc_sessions').doc(sessionId)
                            .collection('viewerCandidates')
                            .add({
                                candidate: event.candidate.candidate,
                                sdpMid: event.candidate.sdpMid,
                                sdpMLineIndex: event.candidate.sdpMLineIndex,
                                timestamp: Date.now()
                            });
                    } catch (err) {
                        console.error('Failed to add ICE candidate:', err);
                    }
                }
            };

            peerConnection.onconnectionstatechange = () => {
                const state = peerConnection.connectionState;
                console.log('Connection state:', state);

                switch (state) {
                    case 'connected':
                        connectingInProgress = false;
                        if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
                        setStatus('connected', 'Connected');
                        hideOverlay();
                        startViewerHeartbeat();
                        db.collection('webrtc_sessions').doc(sessionId)
                            .update({ status: 'connected', viewerHeartbeat: Date.now() }).catch(() => {});
                        break;
                    case 'disconnected':
                        connectingInProgress = false;
                        setStatus('connecting', 'Reconnecting...');
                        showOverlay('Reconnecting...', 'The connection was lost. Trying to reconnect automatically.', true, true);
                        // Give ICE a window to self-heal, then rebuild from scratch.
                        scheduleReconnect(10000);
                        break;
                    case 'failed':
                        connectingInProgress = false;
                        setStatus('connecting', 'Reconnecting...');
                        showOverlay('Reconnecting...', 'Connection failed — retrying automatically.', true, true);
                        scheduleReconnect(2000);
                        break;
                    case 'closed':
                        connectingInProgress = false;
                        setStatus('failed', 'Disconnected');
                        showOverlay('Disconnected', 'The dashcam ended the session.', false, true);
                        break;
                }
            };

            // setRemoteDescription FIRST so the offer's audio m-section creates
            // the audio transceiver. Then we attach our mic track to that same
            // transceiver via replaceTrack — calling addTrack() before SRD
            // creates a parallel m-section that the dashcam can't negotiate,
            // which is why push-to-talk was silent.
            const offer = new RTCSessionDescription({ type: 'offer', sdp: sdpOffer });
            await peerConnection.setRemoteDescription(offer);

            // Mic for push-to-talk — attach to the existing audio transceiver
            try {
                localMicStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                const audioTrack = localMicStream.getAudioTracks()[0];
                // Keep enabled=true so RTP packets actually flow as soon as
                // the transceiver is sendrecv. We mute/unmute via the SENDER
                // (replaceTrack with null/track), which is the only reliable
                // way across browsers — toggling track.enabled silently
                // dropped packets on some Samsung Internet builds.
                audioTrack.enabled = true;
                micTrackForPtt = audioTrack;
                const audioTransceiver = peerConnection.getTransceivers().find(
                    t => t.receiver && t.receiver.track && t.receiver.track.kind === 'audio'
                );
                if (audioTransceiver) {
                    // Force sendrecv BEFORE replaceTrack so the answer's m=audio
                    // is sendrecv (not recvonly).
                    try { audioTransceiver.direction = 'sendrecv'; } catch (e) { console.warn('direction set failed:', e); }
                    await audioTransceiver.sender.replaceTrack(audioTrack);
                    micSender = audioTransceiver.sender;
                    console.log('[PTT] mic attached to existing transceiver, direction =', audioTransceiver.direction);
                } else {
                    micSender = peerConnection.addTrack(audioTrack, localMicStream);
                    console.log('[PTT] mic added via addTrack (no existing audio transceiver)');
                }
                // Mute by removing the track from the sender; PTT button puts it back.
                await micSender.replaceTrack(null);
                pttReady = true;
                updatePttBadge();
            } catch (micErr) {
                console.warn('[PTT] Mic not available:', micErr.name, micErr.message);
                pttReady = false;
                pttBlockReason = micErr.name === 'NotAllowedError'
                    ? 'Mic blocked'
                    : 'Mic unavailable';
                updatePttBadge();
            }

            const answer = await peerConnection.createAnswer();
            await peerConnection.setLocalDescription(answer);
            // Sanity check — log the direction the answer claims for m=audio.
            try {
                const audioSection = answer.sdp.split(/^m=/m).find(s => s.startsWith('audio'));
                const dirLine = audioSection && audioSection.split('\n').find(l => /^a=(sendrecv|sendonly|recvonly|inactive)/.test(l.trim()));
                console.log('[PTT] answer m=audio direction:', dirLine && dirLine.trim());
            } catch (_) {}

            await db.collection('webrtc_sessions').doc(sessionId)
                .update({
                    viewerAnswer: answer.sdp,
                    viewerConnected: viewerId,
                    viewerConnectedAt: Date.now(),
                    viewerHeartbeat: Date.now()
                });

            // Listen for dashcam ICE candidates
            unsubCandidates = db.collection('webrtc_sessions').doc(sessionId)
                .collection('dashcamCandidates')
                .onSnapshot((snapshot) => {
                    snapshot.docChanges().forEach((change) => {
                        if (change.type === 'added') {
                            const data = change.doc.data();
                            const candidate = new RTCIceCandidate({
                                candidate: data.candidate,
                                sdpMid: data.sdpMid,
                                sdpMLineIndex: data.sdpMLineIndex
                            });
                            peerConnection.addIceCandidate(candidate).catch(() => {});
                        }
                    });
                });

            // Listen for motion alerts, cabin temperature, and heat alerts
            unsubMotion = db.collection('webrtc_sessions').doc(sessionId)
                .onSnapshot((snap) => {
                    const data = snap.data();
                    if (!data) return;
                    if (data.motionAlert && data.motionAlert.timestamp) {
                        const ts = data.motionAlert.timestamp;
                        if (ts > lastMotionTimestamp) {
                            lastMotionTimestamp = ts;
                            if (data.motionAlert.type === 'threat_detected') {
                                showThreatAlert(data.motionAlert.kind, data.motionAlert.imageUrl);
                            } else {
                                showMotionAlert();
                            }
                        }
                    }
                    if (data.cabinTemp && typeof data.cabinTemp.celsius === 'number') {
                        updateTempReadout(data.cabinTemp.celsius, data.cabinTemp.approximate);
                    }
                    if (data.tempAlert && data.tempAlert.timestamp) {
                        const ts = data.tempAlert.timestamp;
                        if (ts > lastTempAlertTimestamp) {
                            lastTempAlertTimestamp = ts;
                            showTempAlert(data.tempAlert.celsius);
                        }
                    }
                });

            // Watch for dashcam offer changes (dashcam regenerated offer for reconnect)
            currentOffer = sdpOffer;
            if (unsubOfferWatch) { unsubOfferWatch(); unsubOfferWatch = null; }
            unsubOfferWatch = db.collection('webrtc_sessions').doc(sessionId)
                .onSnapshot((snap) => {
                    const data = snap.data();
                    if (!data) return;
                    const newOffer = data.dashcamOffer;
                    if (newOffer && newOffer !== currentOffer) {
                        console.log('Dashcam regenerated offer — re-answering with new offer');
                        currentOffer = newOffer;
                        cleanup();
                        startWebRtc(newOffer);
                    }
                });
        }

        // ─── Viewer heartbeat (single-viewer lock) ─────────────────────
        function startViewerHeartbeat() {
            stopViewerHeartbeat();
            heartbeatInterval = setInterval(() => {
                if (sessionId) {
                    db.collection('webrtc_sessions').doc(sessionId)
                        .update({ viewerHeartbeat: Date.now() }).catch(() => {});
                }
            }, 30000); // every 30 seconds
        }

        function stopViewerHeartbeat() {
            if (heartbeatInterval) {
                clearInterval(heartbeatInterval);
                heartbeatInterval = null;
            }
        }

        function retryConnection() {
            cleanup();
            sessionId = null;
            sessionSecret = null;
            connectToSession();
        }

        function cleanup() {
            connectingInProgress = false;
            stopViewerHeartbeat();
            // Clear viewer lock in Firestore
            if (sessionId) {
                db.collection('webrtc_sessions').doc(sessionId)
                    .update({
                        viewerConnected: firebase.firestore.FieldValue.delete(),
                        viewerConnectedAt: firebase.firestore.FieldValue.delete(),
                        viewerHeartbeat: firebase.firestore.FieldValue.delete()
                    }).catch(() => {});
            }
            if (unsubAnswer) { unsubAnswer(); unsubAnswer = null; }
            if (unsubCandidates) { unsubCandidates(); unsubCandidates = null; }
            if (unsubMotion) { unsubMotion(); unsubMotion = null; }
            if (unsubOfferWatch) { unsubOfferWatch(); unsubOfferWatch = null; }
            // NOTE: don't kill unsubDevice here — we want it to keep watching
            // so it auto-reconnects when dashcam comes back online
            if (localMicStream) {
                localMicStream.getTracks().forEach(t => t.stop());
                localMicStream = null;
            }
            micSender = null;
            if (peerConnection) {
                peerConnection.close();
                peerConnection = null;
            }
            video.srcObject = null;
        }

        // ─── Camera rotation (remote) ────────────────────────────────────
        let rearRotation = 0;
        let frontRotation = 0;
        const rotateLabel = document.getElementById('rotateLabel');

        function rotateVideo() {
            if (!sessionId) return;
            const update = {};
            if (currentCameraMode === 'rear') {
                rearRotation = (rearRotation + 90) % 360;
                update.rearRotation = rearRotation;
                if (rotateLabel) rotateLabel.textContent = rearRotation + '°';
            } else {
                frontRotation = (frontRotation + 90) % 360;
                update.frontRotation = frontRotation;
                if (rotateLabel) rotateLabel.textContent = frontRotation + '°';
            }
            db.collection('webrtc_sessions').doc(sessionId)
                .update(update)
                .catch(err => console.error('Failed to update rotation:', err));
        }

        // ─── Camera mode toggle ─────────────────────────────────────────
        let currentCameraMode = 'rear';
        const camLabel = document.getElementById('camLabel');
        const cameraModes = ['rear', 'front'];
        const cameraModeLabels = { rear: 'Rear', front: 'Front' };

        function cycleCameraMode() {
            if (!sessionId) return;
            const idx = cameraModes.indexOf(currentCameraMode);
            currentCameraMode = cameraModes[(idx + 1) % cameraModes.length];
            camLabel.textContent = cameraModeLabels[currentCameraMode];
            // rotateLabel's button was removed from the page; a bare .textContent on
            // the null lookup threw here and killed the Firestore write below, which
            // is why the camera-switch button changed its label but did nothing.
            if (rotateLabel) rotateLabel.textContent = (currentCameraMode === 'rear' ? rearRotation : frontRotation) + '°';
            db.collection('webrtc_sessions').doc(sessionId)
                .update({ cameraMode: currentCameraMode })
                .catch(err => console.error('Failed to set camera mode:', err));
        }

        // ─── Flashlight toggle ──────────────────────────────────────────
        let flashlightOn = false;
        const flashBtn = document.getElementById('flashBtn');
        const flashLabel = document.getElementById('flashLabel');

        function toggleFlashlight() {
            if (!sessionId) return;
            flashlightOn = !flashlightOn;
            flashLabel.textContent = flashlightOn ? 'Flash ON' : 'Flash';
            flashBtn.style.background = flashlightOn ? '#f59e0b' : '';
            db.collection('webrtc_sessions').doc(sessionId)
                .update({ flashlight: flashlightOn })
                .catch(err => console.error('Failed to toggle flashlight:', err));
        }

        // ─── Push-to-talk ───────────────────────────────────────────────
        const talkBtn = document.getElementById('talkBtn');
        const talkLabel = document.getElementById('talkLabel');

        function updatePttBadge() {
            if (!talkLabel) return;
            if (!pttReady) {
                talkLabel.textContent = 'Mic ⛔';
                return;
            }
            if (pttSending) {
                talkLabel.textContent = 'TX ●';
            } else {
                talkLabel.textContent = 'Hold to Talk';
            }
        }

        async function startTalk() {
            if (!micSender || !micTrackForPtt) {
                console.warn('[PTT] start: no sender or track yet');
                return;
            }
            try {
                micTrackForPtt.enabled = true;
                await micSender.replaceTrack(micTrackForPtt);
                pttSending = true;
                talkBtn.classList.add('active');
                updatePttBadge();
                console.log('[PTT] start: track attached to sender');
                // Poll outbound-rtp audio stats so we can SEE bytes flowing.
                if (pttStatsTimer) clearInterval(pttStatsTimer);
                let lastBytes = 0;
                pttStatsTimer = setInterval(async () => {
                    if (!peerConnection) return;
                    try {
                        const stats = await peerConnection.getStats(micSender.track);
                        stats.forEach(r => {
                            if (r.type === 'outbound-rtp' && r.kind === 'audio') {
                                const delta = (r.bytesSent || 0) - lastBytes;
                                lastBytes = r.bytesSent || 0;
                                talkLabel.textContent = delta > 0 ? `TX ● ${Math.round(delta/100)/10}KB/s` : 'TX (0)';
                            }
                        });
                    } catch (_) {}
                }, 1000);
            } catch (e) {
                console.error('[PTT] start failed:', e);
            }
        }

        async function stopTalk() {
            if (pttStatsTimer) { clearInterval(pttStatsTimer); pttStatsTimer = null; }
            try {
                if (micSender) await micSender.replaceTrack(null);
            } catch (e) {
                console.warn('[PTT] stop replaceTrack(null) failed:', e);
            }
            pttSending = false;
            talkBtn.classList.remove('active');
            updatePttBadge();
        }

        talkBtn.addEventListener('mousedown', (e) => { e.preventDefault(); startTalk(); });
        talkBtn.addEventListener('mouseup', stopTalk);
        talkBtn.addEventListener('mouseleave', stopTalk);
        talkBtn.addEventListener('touchstart', (e) => { e.preventDefault(); startTalk(); });
        talkBtn.addEventListener('touchend', stopTalk);
        talkBtn.addEventListener('touchcancel', stopTalk);

        // ─── Cleanup on page unload ────────────────────────────────────
        window.addEventListener('beforeunload', () => {
            stopViewerHeartbeat();
            if (sessionId) {
                db.collection('webrtc_sessions').doc(sessionId)
                    .update({
                        status: 'ended',
                        flashlight: false,
                        viewerConnected: firebase.firestore.FieldValue.delete(),
                        viewerConnectedAt: firebase.firestore.FieldValue.delete(),
                        viewerHeartbeat: firebase.firestore.FieldValue.delete()
                    }).catch(() => {});
            }
            if (unsubDevice) { unsubDevice(); unsubDevice = null; }
            if (unsubOfferWatch) { unsubOfferWatch(); unsubOfferWatch = null; }
            cleanup();
        });

        // ─── Keep screen awake ─────────────────────────────────────────
        let wakeLock = null;
        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                }
            } catch (err) {}
        }

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState !== 'visible') return;
            requestWakeLock();
            // Screen-off kills the peer without firing state events the frozen
            // tab could act on. On return, anything not connected/connecting is
            // dead — rebuild now rather than waiting for a listener to fire.
            const st = peerConnection ? peerConnection.connectionState : 'none';
            if (sessionId && st !== 'connected' && st !== 'connecting') {
                console.log('Tab visible with dead connection (' + st + ') — reconnecting');
                cleanup();
                tryConnectSession();
            }
        });

        // ─── Start ─────────────────────────────────────────────────────
        requestWakeLock();

        // ?reset in URL clears saved data and forces fresh start
        if (params.has('reset')) {
            localStorage.removeItem('drivesight_device_id');
            localStorage.removeItem('drivesight_session_id');
            localStorage.removeItem('drivesight_session_secret');
            deviceId = null;
            directSessionId = null;
            directSecret = null;
            window.history.replaceState({}, '', window.location.pathname);
        }

        if (directSessionId && directSecret) {
            // QR code scan — direct session access (legacy)
            connectDirect(directSessionId, directSecret);
        } else if (deviceId) {
            // Access code pairing (from URL param or previous entry)
            showViewer();
            connectToSession();
        } else {
            // No session info — show code entry screen
        }
    </script>
</body>
</html>
