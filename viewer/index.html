<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DriveSight Remote Viewer</title>
    <link rel="icon" type="image/png" href="../assets/icon-512.png">
    <link rel="manifest" href="manifest.json">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #0a0a0a;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            -webkit-user-select: none;
            user-select: none;
        }

        /* ─── Pairing Screen ──────────────────────────────────────── */
        .pair-screen {
            text-align: center;
            padding: 24px;
            max-width: 360px;
        }

        .pair-logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 16px;
            border-radius: 20px;
        }

        .pair-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .pair-subtitle {
            font-size: 14px;
            color: #888;
            margin-bottom: 32px;
            line-height: 1.5;
        }

        .code-input-row {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-bottom: 24px;
        }

        .code-char {
            width: 44px;
            height: 56px;
            background: #1a1a1a;
            border: 2px solid #333;
            border-radius: 10px;
            color: #fff;
            font-size: 24px;
            font-weight: 700;
            text-align: center;
            text-transform: uppercase;
            outline: none;
            transition: border-color 0.2s;
            caret-color: #f59e0b;
        }

        .code-char:focus {
            border-color: #f59e0b;
        }

        .connect-btn {
            width: 100%;
            padding: 14px;
            background: #2D7D46;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .connect-btn:hover { background: #236B38; }
        .connect-btn:disabled { background: #333; color: #666; cursor: not-allowed; }

        .pair-hint {
            margin-top: 16px;
            font-size: 12px;
            color: #555;
            line-height: 1.5;
        }

        .pair-error {
            margin-top: 12px;
            font-size: 13px;
            color: #ef4444;
            min-height: 20px;
        }

        /* ─── Viewer Screen ──────────────────────────────────────── */
        .viewer-screen { display: none; width: 100%; height: 100%; }
        .viewer-screen.active { display: flex; flex-direction: column; }
        .pair-screen.hidden { display: none; }

        /* Status bar at top */
        .status-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
            z-index: 10;
        }

        .status-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #666;
            transition: background 0.3s;
        }
        .status-dot.connecting { background: #f59e0b; animation: pulse 1.5s infinite; }
        .status-dot.connected { background: #22c55e; }
        .status-dot.failed { background: #ef4444; }

        .status-text {
            font-size: 14px;
            color: #999;
            transition: color 0.3s;
        }
        .status-text.connected { color: #22c55e; }
        .status-text.failed { color: #ef4444; }

        .logo-text {
            font-size: 13px;
            color: #555;
            font-weight: 600;
        }

        /* Video container */
        .video-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }

        /* Center overlay (connecting / error messages) */
        .center-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 5;
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 3px solid #333;
            border-top: 3px solid #f59e0b;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }

        .overlay-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .overlay-subtitle {
            font-size: 14px;
            color: #888;
            max-width: 300px;
            line-height: 1.5;
        }

        .retry-btn {
            margin-top: 16px;
            padding: 10px 24px;
            background: #f59e0b;
            color: #000;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
        .retry-btn:hover { background: #d97706; }

        /* Motion alert banner */
        .motion-alert {
            position: fixed;
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
            background: #ef4444;
            color: #fff;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 20;
            animation: slideDown 0.3s ease-out, fadeOut 0.5s ease-in 4.5s forwards;
            box-shadow: 0 4px 20px rgba(239,68,68,0.4);
        }

        .motion-alert-icon { width: 20px; height: 20px; }

        /* Bottom bar */
        .bottom-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px 16px;
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
            z-index: 10;
            gap: 12px;
        }

        .fullscreen-btn, .talk-btn {
            padding: 8px 16px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            color: #ccc;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            -webkit-user-select: none;
            user-select: none;
            touch-action: none;
        }
        .fullscreen-btn:hover, .talk-btn:hover { background: rgba(255,255,255,0.2); }
        .talk-btn.active { background: #ef4444; border-color: #ef4444; color: #fff; }

        .hidden { display: none !important; }

        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
        @keyframes slideDown { from { top: 40px; opacity: 0; } to { top: 60px; opacity: 1; } }
        @keyframes fadeOut { to { opacity: 0; visibility: hidden; } }

        @media (orientation: landscape) {
            .status-bar { padding: 8px 16px; }
            .bottom-bar { padding: 8px 16px; }
        }

        .error-icon { font-size: 48px; margin-bottom: 12px; }

        /* Unpair / new code button */
        .unpair-link {
            position: fixed;
            bottom: 56px;
            right: 12px;
            font-size: 13px;
            color: #888;
            cursor: pointer;
            z-index: 11;
            padding: 6px 12px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 6px;
        }
        .unpair-link:hover { color: #fff; background: rgba(255,255,255,0.15); }
    </style>
</head>
<body>

    <!-- ═══ PAIRING SCREEN ═══ -->
    <div class="pair-screen" id="pairScreen">
        <img class="pair-logo" src="../assets/icon-512.png" alt="DriveSight" onerror="this.style.display='none'">
        <div class="pair-title">DriveSight Viewer</div>
        <div class="pair-subtitle">Enter the 6-character code shown in your DriveSight app under Settings → Remote Viewer</div>

        <div class="code-input-row" id="codeRow">
            <input class="code-char" type="text" maxlength="1" inputmode="text" autocapitalize="characters" autocomplete="off" data-idx="0">
            <input class="code-char" type="text" maxlength="1" inputmode="text" autocapitalize="characters" autocomplete="off" data-idx="1">
            <input class="code-char" type="text" maxlength="1" inputmode="text" autocapitalize="characters" autocomplete="off" data-idx="2">
            <input class="code-char" type="text" maxlength="1" inputmode="text" autocapitalize="characters" autocomplete="off" data-idx="3">
            <input class="code-char" type="text" maxlength="1" inputmode="text" autocapitalize="characters" autocomplete="off" data-idx="4">
            <input class="code-char" type="text" maxlength="1" inputmode="text" autocapitalize="characters" autocomplete="off" data-idx="5">
        </div>

        <button class="connect-btn" id="connectBtn" onclick="pairAndConnect()" disabled>Connect</button>

        <div class="pair-error" id="pairError"></div>

        <div class="pair-hint">
            You only need to do this once.<br>
            After pairing, this page auto-connects every time.
        </div>
    </div>

    <!-- ═══ VIEWER SCREEN ═══ -->
    <div class="viewer-screen" id="viewerScreen">
        <!-- Status bar -->
        <div class="status-bar">
            <div class="status-left">
                <div class="status-dot" id="statusDot"></div>
                <span class="status-text" id="statusText">Initializing...</span>
            </div>
            <span class="logo-text">DriveSight</span>
        </div>

        <!-- Video -->
        <div class="video-container">
            <video id="remoteVideo" autoplay playsinline></video>

            <!-- Center overlay for states -->
            <div class="center-overlay" id="centerOverlay">
                <div class="spinner" id="spinner"></div>
                <div class="overlay-title" id="overlayTitle">Connecting to Dashcam...</div>
                <div class="overlay-subtitle" id="overlaySubtitle">Establishing secure connection</div>
                <button class="retry-btn hidden" id="retryBtn" onclick="retryConnection()">Retry Connection</button>
                <button class="retry-btn" id="newCodeBtn" onclick="unpair()" style="background:transparent; border:1px solid #555; color:#999; margin-top:8px;">Enter New Code</button>
            </div>
        </div>

        <!-- Bottom bar -->
        <div class="bottom-bar">
            <button class="talk-btn" id="talkBtn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/>
                    <path d="M19 10v2a7 7 0 01-14 0v-2"/>
                    <line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/>
                </svg>
                <span id="talkLabel">Hold to Talk</span>
            </button>
            <button class="fullscreen-btn" onclick="rotateVideo()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 102.13-9.36L1 10"/>
                </svg>
                <span id="rotateLabel">0°</span>
            </button>
            <button class="fullscreen-btn" id="camBtn" onclick="cycleCameraMode()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/>
                    <circle cx="12" cy="13" r="4"/>
                </svg>
                <span id="camLabel">Rear</span>
            </button>
            <button class="fullscreen-btn" id="flashBtn" onclick="toggleFlashlight()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
                </svg>
                <span id="flashLabel">Flash</span>
            </button>
            <button class="fullscreen-btn" onclick="toggleFullscreen()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M8 3H5a2 2 0 00-2 2v3m18 0V5a2 2 0 00-2-2h-3m0 18h3a2 2 0 002-2v-3M3 16v3a2 2 0 002 2h3"/>
                </svg>
                Fullscreen
            </button>
        </div>

        <div class="unpair-link" onclick="unpair()">⟳ Enter New Code</div>
    </div>

    <!-- Motion alert (injected dynamically) -->
    <div id="alertContainer"></div>

    <!-- Firebase JS SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-messaging-compat.js"></script>

    <script>
        // ─── Firebase Config ───────────────────────────────────────────
        const firebaseConfig = {
            apiKey: "AIzaSyBn6SRgwVvcNkP9sUoHep_iShLFC-pJSIk",
            authDomain: "deer-dash.firebaseapp.com",
            projectId: "deer-dash",
            storageBucket: "deer-dash.firebasestorage.app",
            messagingSenderId: "834190963152",
            appId: "1:834190963152:web:viewer"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // ─── Parse URL params ──────────────────────────────────────────
        const params = new URLSearchParams(window.location.search);
        let deviceId = params.get('d') || localStorage.getItem('drivesight_device_id');
        let sessionId = null;
        let sessionSecret = null;

        // ─── DOM refs ──────────────────────────────────────────────────
        const pairScreen = document.getElementById('pairScreen');
        const viewerScreen = document.getElementById('viewerScreen');
        const connectBtn = document.getElementById('connectBtn');
        const pairError = document.getElementById('pairError');
        const video = document.getElementById('remoteVideo');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const centerOverlay = document.getElementById('centerOverlay');
        const spinner = document.getElementById('spinner');
        const overlayTitle = document.getElementById('overlayTitle');
        const overlaySubtitle = document.getElementById('overlaySubtitle');
        const retryBtn = document.getElementById('retryBtn');
        const alertContainer = document.getElementById('alertContainer');

        // ─── State ─────────────────────────────────────────────────────
        let peerConnection = null;
        let unsubAnswer = null;
        let unsubCandidates = null;
        let unsubMotion = null;
        let unsubDevice = null;
        let lastMotionTimestamp = 0;
        let localMicStream = null;
        let micSender = null;

        // ─── ICE config ────────────────────────────────────────────────
        const rtcConfig = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' },
                { urls: 'stun:stun2.l.google.com:19302' },
                { urls: 'stun:stun3.l.google.com:19302' }
            ],
            sdpSemantics: 'unified-plan'
        };

        // ─── Code Input Handling ───────────────────────────────────────
        const codeInputs = document.querySelectorAll('.code-char');

        codeInputs.forEach((input, idx) => {
            input.addEventListener('input', (e) => {
                const val = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
                e.target.value = val;
                if (val && idx < 5) codeInputs[idx + 1].focus();
                updateConnectBtn();
            });
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !e.target.value && idx > 0) {
                    codeInputs[idx - 1].focus();
                }
                if (e.key === 'Enter') {
                    pairAndConnect();
                }
            });
            // Handle paste
            input.addEventListener('paste', (e) => {
                e.preventDefault();
                const text = (e.clipboardData.getData('text') || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
                for (let i = 0; i < 6 && i < text.length; i++) {
                    codeInputs[i].value = text[i];
                }
                if (text.length >= 6) codeInputs[5].focus();
                updateConnectBtn();
            });
        });

        function updateConnectBtn() {
            const code = getCode();
            connectBtn.disabled = code.length < 6;
        }

        function getCode() {
            return Array.from(codeInputs).map(i => i.value).join('');
        }

        // ─── Pairing ──────────────────────────────────────────────────
        async function pairAndConnect() {
            const code = getCode();
            if (code.length < 6) return;

            connectBtn.disabled = true;
            connectBtn.textContent = 'Connecting...';
            pairError.textContent = '';

            try {
                const deviceDoc = await db.collection('devices').doc(code).get();
                if (!deviceDoc.exists) {
                    pairError.textContent = 'Device not found. Check the code and make sure Remote Viewer is enabled.';
                    connectBtn.disabled = false;
                    connectBtn.textContent = 'Connect';
                    return;
                }

                // Save and connect
                deviceId = code;
                localStorage.setItem('drivesight_device_id', code);
                const data = deviceDoc.data();
                sessionId = data.sessionId;
                sessionSecret = data.sessionSecret;

                showViewer();
                await connectToSession();
            } catch (err) {
                pairError.textContent = 'Connection failed. Check your internet.';
                connectBtn.disabled = false;
                connectBtn.textContent = 'Connect';
            }
        }

        function showViewer() {
            pairScreen.classList.add('hidden');
            viewerScreen.classList.add('active');
        }

        function unpair() {
            localStorage.removeItem('drivesight_device_id');
            if (unsubDevice) { unsubDevice(); unsubDevice = null; }
            cleanup();
            location.reload();
        }

        // ─── UI helpers ────────────────────────────────────────────────
        function setStatus(state, text) {
            statusDot.className = 'status-dot ' + state;
            statusText.textContent = text;
            statusText.className = 'status-text ' + state;
        }

        function showOverlay(title, subtitle, showSpinner, showRetry) {
            centerOverlay.classList.remove('hidden');
            overlayTitle.textContent = title;
            overlaySubtitle.textContent = subtitle;
            spinner.classList.toggle('hidden', !showSpinner);
            retryBtn.classList.toggle('hidden', !showRetry);
        }

        function hideOverlay() {
            centerOverlay.classList.add('hidden');
        }

        function showMotionAlert() {
            const alert = document.createElement('div');
            alert.className = 'motion-alert';
            alert.innerHTML = `
                <svg class="motion-alert-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
                    <line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
                </svg>
                Motion Detected!
            `;
            alertContainer.innerHTML = '';
            alertContainer.appendChild(alert);

            if (Notification.permission === 'granted') {
                new Notification('DriveSight', {
                    body: 'Motion detected on your dashcam!',
                    icon: '../assets/icon-512.png',
                    tag: 'motion-alert',
                    renotify: true
                });
            }

            setTimeout(() => { alert.remove(); }, 5000);
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                document.exitFullscreen().catch(() => {});
            }
        }

        // ─── FCM Web Push ──────────────────────────────────────────────
        async function setupPushNotifications() {
            try {
                if (!('Notification' in window) || !('serviceWorker' in navigator)) return;

                const permission = await Notification.requestPermission();
                if (permission !== 'granted') return;

                const messaging = firebase.messaging();
                const token = await messaging.getToken({
                    vapidKey: null // Will use default FCM if no VAPID key
                }).catch(() => null);

                if (token && deviceId) {
                    // Save FCM token to device document for Cloud Function to use
                    await db.collection('devices').doc(deviceId).update({
                        viewerFcmToken: token
                    }).catch(() => {
                        // If update fails (field doesn't exist yet), use set with merge
                        return db.collection('devices').doc(deviceId).set({
                            viewerFcmToken: token
                        }, { merge: true });
                    });
                    console.log('FCM token saved for push notifications');
                }

                // Handle foreground messages
                messaging.onMessage((payload) => {
                    console.log('FCM message received:', payload);
                    if (payload.data && payload.data.type === 'motion_alert') {
                        showMotionAlert();
                    }
                });
            } catch (err) {
                console.log('Push notification setup skipped:', err.message);
            }
        }

        // ─── Request notification permission ───────────────────────────
        function requestNotificationPermission() {
            if ('Notification' in window && Notification.permission === 'default') {
                Notification.requestPermission();
            }
        }

        // ─── Connection logic ──────────────────────────────────────────
        async function connectToSession() {
            setStatus('connecting', 'Waiting for dashcam...');
            showOverlay('Waiting for Dashcam...', 'Open DriveSight and switch to the Drive screen with Remote Viewer enabled', true, false);

            // Stop any previous device listener
            if (unsubDevice) { unsubDevice(); unsubDevice = null; }

            // ── Live-listen on the device doc so we auto-connect when dashcam comes online ──
            unsubDevice = db.collection('devices').doc(deviceId)
                .onSnapshot(async (deviceSnap) => {
                    // Ignore if we're already connected or mid-handshake
                    if (peerConnection && (peerConnection.connectionState === 'connected' ||
                        peerConnection.connectionState === 'connecting')) return;

                    if (!deviceSnap.exists) {
                        setStatus('connecting', 'Waiting for dashcam...');
                        showOverlay('Waiting for Dashcam...', 'Open DriveSight and switch to the Drive screen with Remote Viewer enabled', true, false);
                        return;
                    }

                    const deviceData = deviceSnap.data();
                    const newSessionId = deviceData.sessionId;
                    const newSecret = deviceData.sessionSecret;

                    if (!newSessionId || !newSecret) {
                        setStatus('connecting', 'Waiting for dashcam...');
                        showOverlay('Waiting for Dashcam...', 'Enable Remote Viewer in DriveSight Settings, then switch to Drive screen', true, false);
                        return;
                    }

                    // If session changed (dashcam restarted), clean up old connection
                    if (newSessionId !== sessionId && peerConnection) {
                        console.log('Session changed — reconnecting');
                        cleanup();
                    }

                    sessionId = newSessionId;
                    sessionSecret = newSecret;

                    // Now try to connect to the WebRTC session
                    await tryConnectSession();

                }, (err) => {
                    console.error('Device listener error:', err);
                    showOverlay('Connection Error', 'Failed to reach server. Check your internet.', false, true);
                    setStatus('failed', 'Connection error');
                });
        }

        async function tryConnectSession() {
            // Already in a WebRTC session — skip
            if (peerConnection && peerConnection.connectionState === 'connected') return;

            setStatus('connecting', 'Connecting...');
            showOverlay('Connecting to Dashcam...', 'Establishing secure peer-to-peer connection', true, false);

            try {
                const sessionDoc = await db.collection('webrtc_sessions').doc(sessionId).get();

                if (!sessionDoc.exists) {
                    // Session doc not created yet — wait for device listener to fire again
                    setStatus('connecting', 'Waiting for session...');
                    showOverlay('Waiting for Dashcam...', 'Dashcam is starting up...', true, false);
                    return;
                }

                const sessionData = sessionDoc.data();

                if (sessionData.sessionSecret !== sessionSecret) {
                    showOverlay('Access Denied', 'Session secret mismatch.', false, true);
                    setStatus('failed', 'Access denied');
                    return;
                }

                const sdpOffer = sessionData.dashcamOffer;
                if (!sdpOffer) {
                    // Offer not ready yet — listen for it
                    showOverlay('Waiting for Dashcam...', 'Waiting for dashcam to start streaming...', true, false);
                    setStatus('connecting', 'Waiting for stream...');

                    unsubAnswer = db.collection('webrtc_sessions').doc(sessionId)
                        .onSnapshot((snap) => {
                            const data = snap.data();
                            if (data && data.dashcamOffer) {
                                if (unsubAnswer) unsubAnswer();
                                unsubAnswer = null;
                                startWebRtc(data.dashcamOffer);
                            }
                        });
                    return;
                }

                await startWebRtc(sdpOffer);

            } catch (err) {
                console.error('Connection error:', err);
                showOverlay('Connection Error', 'Failed to connect. Check your internet and try again.', false, true);
                setStatus('failed', 'Connection error');
            }
        }

        async function startWebRtc(sdpOffer) {
            setStatus('connecting', 'Connecting...');
            showOverlay('Connecting to Dashcam...', 'Setting up peer-to-peer video stream', true, false);

            requestNotificationPermission();
            setupPushNotifications();

            // ── Clear stale viewer data from previous connection ──
            try {
                // Remove old viewer answer so dashcam knows to expect a fresh one
                await db.collection('webrtc_sessions').doc(sessionId)
                    .update({ viewerAnswer: firebase.firestore.FieldValue.delete(), status: 'waiting' });

                // Delete old viewer ICE candidates
                const oldCandidates = await db.collection('webrtc_sessions').doc(sessionId)
                    .collection('viewerCandidates').get();
                const batch = db.batch();
                oldCandidates.forEach(doc => batch.delete(doc.ref));
                if (!oldCandidates.empty) await batch.commit();
                console.log('Cleared stale viewer data (' + oldCandidates.size + ' old candidates)');
            } catch (cleanErr) {
                console.warn('Failed to clear stale data (may be first connection):', cleanErr.message);
            }

            peerConnection = new RTCPeerConnection(rtcConfig);

            peerConnection.ontrack = (event) => {
                console.log('Got remote track:', event.track.kind);
                if (event.streams && event.streams[0]) {
                    video.srcObject = event.streams[0];
                } else {
                    const stream = new MediaStream();
                    stream.addTrack(event.track);
                    video.srcObject = stream;
                }
            };

            peerConnection.onicecandidate = async (event) => {
                if (event.candidate) {
                    try {
                        await db.collection('webrtc_sessions').doc(sessionId)
                            .collection('viewerCandidates')
                            .add({
                                candidate: event.candidate.candidate,
                                sdpMid: event.candidate.sdpMid,
                                sdpMLineIndex: event.candidate.sdpMLineIndex,
                                timestamp: Date.now()
                            });
                    } catch (err) {
                        console.error('Failed to add ICE candidate:', err);
                    }
                }
            };

            peerConnection.onconnectionstatechange = () => {
                const state = peerConnection.connectionState;
                console.log('Connection state:', state);

                switch (state) {
                    case 'connected':
                        setStatus('connected', 'Connected');
                        hideOverlay();
                        db.collection('webrtc_sessions').doc(sessionId)
                            .update({ status: 'connected' }).catch(() => {});
                        break;
                    case 'disconnected':
                        setStatus('connecting', 'Reconnecting...');
                        showOverlay('Reconnecting...', 'The connection was lost. Trying to reconnect automatically.', true, true);
                        break;
                    case 'failed':
                        setStatus('failed', 'Connection failed');
                        showOverlay('Connection Failed', 'Could not establish a direct connection. Try switching to a different network.', false, true);
                        break;
                    case 'closed':
                        setStatus('failed', 'Disconnected');
                        showOverlay('Disconnected', 'The dashcam ended the session.', false, true);
                        break;
                }
            };

            // Mic for push-to-talk
            try {
                localMicStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                const audioTrack = localMicStream.getAudioTracks()[0];
                audioTrack.enabled = false;
                micSender = peerConnection.addTrack(audioTrack, localMicStream);
            } catch (micErr) {
                console.warn('Mic not available:', micErr.message);
            }

            const offer = new RTCSessionDescription({ type: 'offer', sdp: sdpOffer });
            await peerConnection.setRemoteDescription(offer);

            const answer = await peerConnection.createAnswer();
            await peerConnection.setLocalDescription(answer);

            await db.collection('webrtc_sessions').doc(sessionId)
                .update({ viewerAnswer: answer.sdp });

            // Listen for dashcam ICE candidates
            unsubCandidates = db.collection('webrtc_sessions').doc(sessionId)
                .collection('dashcamCandidates')
                .onSnapshot((snapshot) => {
                    snapshot.docChanges().forEach((change) => {
                        if (change.type === 'added') {
                            const data = change.doc.data();
                            const candidate = new RTCIceCandidate({
                                candidate: data.candidate,
                                sdpMid: data.sdpMid,
                                sdpMLineIndex: data.sdpMLineIndex
                            });
                            peerConnection.addIceCandidate(candidate).catch(() => {});
                        }
                    });
                });

            // Listen for motion alerts
            unsubMotion = db.collection('webrtc_sessions').doc(sessionId)
                .onSnapshot((snap) => {
                    const data = snap.data();
                    if (data && data.motionAlert && data.motionAlert.timestamp) {
                        const ts = data.motionAlert.timestamp;
                        if (ts > lastMotionTimestamp) {
                            lastMotionTimestamp = ts;
                            showMotionAlert();
                        }
                    }
                });
        }

        function retryConnection() {
            cleanup();
            sessionId = null;
            sessionSecret = null;
            connectToSession();
        }

        function cleanup() {
            if (unsubAnswer) { unsubAnswer(); unsubAnswer = null; }
            if (unsubCandidates) { unsubCandidates(); unsubCandidates = null; }
            if (unsubMotion) { unsubMotion(); unsubMotion = null; }
            // NOTE: don't kill unsubDevice here — we want it to keep watching
            // so it auto-reconnects when dashcam comes back online
            if (localMicStream) {
                localMicStream.getTracks().forEach(t => t.stop());
                localMicStream = null;
            }
            micSender = null;
            if (peerConnection) {
                peerConnection.close();
                peerConnection = null;
            }
            video.srcObject = null;
        }

        // ─── Camera rotation (remote) ────────────────────────────────────
        let rearRotation = 0;
        let frontRotation = 0;
        const rotateLabel = document.getElementById('rotateLabel');

        function rotateVideo() {
            if (!sessionId) return;
            const update = {};
            if (currentCameraMode === 'rear') {
                rearRotation = (rearRotation + 90) % 360;
                update.rearRotation = rearRotation;
                rotateLabel.textContent = rearRotation + '°';
            } else {
                frontRotation = (frontRotation + 90) % 360;
                update.frontRotation = frontRotation;
                rotateLabel.textContent = frontRotation + '°';
            }
            db.collection('webrtc_sessions').doc(sessionId)
                .update(update)
                .catch(err => console.error('Failed to update rotation:', err));
        }

        // ─── Camera mode toggle ─────────────────────────────────────────
        let currentCameraMode = 'rear';
        const camLabel = document.getElementById('camLabel');
        const cameraModes = ['rear', 'front', 'split'];
        const cameraModeLabels = { rear: 'Rear', front: 'Front', split: 'Split' };

        function cycleCameraMode() {
            if (!sessionId) return;
            const idx = cameraModes.indexOf(currentCameraMode);
            currentCameraMode = cameraModes[(idx + 1) % cameraModes.length];
            camLabel.textContent = cameraModeLabels[currentCameraMode];
            rotateLabel.textContent = (currentCameraMode === 'rear' ? rearRotation : frontRotation) + '°';
            db.collection('webrtc_sessions').doc(sessionId)
                .update({ cameraMode: currentCameraMode })
                .catch(err => console.error('Failed to set camera mode:', err));
        }

        // ─── Flashlight toggle ──────────────────────────────────────────
        let flashlightOn = false;
        const flashBtn = document.getElementById('flashBtn');
        const flashLabel = document.getElementById('flashLabel');

        function toggleFlashlight() {
            if (!sessionId) return;
            flashlightOn = !flashlightOn;
            flashLabel.textContent = flashlightOn ? 'Flash ON' : 'Flash';
            flashBtn.style.background = flashlightOn ? '#f59e0b' : '';
            db.collection('webrtc_sessions').doc(sessionId)
                .update({ flashlight: flashlightOn })
                .catch(err => console.error('Failed to toggle flashlight:', err));
        }

        // ─── Push-to-talk ───────────────────────────────────────────────
        const talkBtn = document.getElementById('talkBtn');
        const talkLabel = document.getElementById('talkLabel');

        function startTalk() {
            if (localMicStream) {
                localMicStream.getAudioTracks().forEach(t => t.enabled = true);
                talkBtn.classList.add('active');
                talkLabel.textContent = 'Talking...';
            }
        }

        function stopTalk() {
            if (localMicStream) {
                localMicStream.getAudioTracks().forEach(t => t.enabled = false);
            }
            talkBtn.classList.remove('active');
            talkLabel.textContent = 'Hold to Talk';
        }

        talkBtn.addEventListener('mousedown', (e) => { e.preventDefault(); startTalk(); });
        talkBtn.addEventListener('mouseup', stopTalk);
        talkBtn.addEventListener('mouseleave', stopTalk);
        talkBtn.addEventListener('touchstart', (e) => { e.preventDefault(); startTalk(); });
        talkBtn.addEventListener('touchend', stopTalk);
        talkBtn.addEventListener('touchcancel', stopTalk);

        // ─── Cleanup on page unload ────────────────────────────────────
        window.addEventListener('beforeunload', () => {
            if (sessionId) {
                db.collection('webrtc_sessions').doc(sessionId)
                    .update({ status: 'ended', flashlight: false }).catch(() => {});
            }
            if (unsubDevice) { unsubDevice(); unsubDevice = null; }
            cleanup();
        });

        // ─── Keep screen awake ─────────────────────────────────────────
        let wakeLock = null;
        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                }
            } catch (err) {}
        }

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') requestWakeLock();
        });

        // ─── Start ─────────────────────────────────────────────────────
        requestWakeLock();

        // ?reset in URL clears saved device and forces code entry
        if (params.has('reset')) {
            localStorage.removeItem('drivesight_device_id');
            deviceId = null;
            // Clean URL without reloading
            window.history.replaceState({}, '', window.location.pathname);
        }

        if (deviceId) {
            // Already paired — go straight to viewer
            showViewer();
            connectToSession();
        } else {
            // Show pairing screen
            codeInputs[0].focus();
        }
    </script>
</body>
</html>
