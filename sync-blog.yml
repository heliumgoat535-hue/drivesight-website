name: Sync BabyLoveGrowth blog posts

on:
  schedule:
    - cron: '17 */6 * * *'   # every 6 hours, offset 17 min
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run sync
        env:
          BABYLOVE_API_KEY: ${{ secrets.BABYLOVE_API_KEY }}
        run: node scripts/sync-blog.mjs
      - name: Commit any new posts
        run: |
          git config user.name "phonedashcam-bot"
          git config user.email "bot@phonedashcam.com"
          if [[ -n "$(git status --porcelain)" ]]; then
            git add -A
            git commit -m "auto: sync blog posts from BabyLoveGrowth"
            git push
          else
            echo "No new posts."
          fi
